name: Fetch Daily Menus

on:
  schedule:
    - cron: '0 7 * * 1-5'
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-menus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitára
        uses: actions/checkout@v4

      - name: Nastav Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inštalácia závislostí
        run: pip install requests beautifulsoup4

      - name: Stiahni menu
        run: python fetch_menus.py

      - name: Ulož menus.json do repozitára
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add menus.json
          git diff --staged --quiet || git commit -m "chore: menu $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
